  cursor: not-allowed;

.form-switch .form-check-input:disabled,

.form-switch .form-check-input {

  top: 50%;
  left: 0;

  height: 16px;

  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);

  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);

.form-switch .form-check-input:checked {
  background: var(--primary);

.form-switch .form-check-input:checked::before {

  &lt;script&gt;
    (() =&gt; {

      const NS = &#x27;http://www.w3.org/2000/svg&#x27;;
      const rows = [
        {step:0, epoch:0, trainLoss:null, evalLoss:0.4385322630, trainAcc:null, evalAcc:0.7371514741, grad:null, lr:null},
        {step:250, epoch:0.1111, trainLoss:0.0183342099, evalLoss:0.0231594481, trainAcc:0.9832339791, evalAcc:0.9727231694, grad:3.078125, lr:9.8989344096},

        {step:1000, epoch:0.4444, trainLoss:0.0070356339, evalLoss:0.0103583643, trainAcc:0.9890029326, evalAcc:0.9858230237, grad:1.265625, lr:6.3183371765},
        {step:1250, epoch:0.5556, trainLoss:0.0061789714, evalLoss:0.0097991759, trainAcc:0.9922279793, evalAcc:0.9861923227, grad:3.265625, lr:4.4973430831},
        {step:1500, epoch:0.6667, trainLoss:0.0068261757, evalLoss:0.0089054508, trainAcc:0.9928166352, evalAcc:0.9873925443, grad:1.3046875, lr:2.7434838961},
        {step:1750, epoch:0.7778, trainLoss:0.0062490955, evalLoss:0.0087286076, trainAcc:0.9921875, evalAcc:0.9877413266, grad:2.765625, lr:1.2910052181},
        {step:2000, epoch:0.8889, trainLoss:0.0056891676, evalLoss:0.0086896149, trainAcc:0.9920243069, evalAcc:0.9877515849, grad:1.7265625, lr:0.3339002417},

      const configs = {
        loss: {
          yTitle: &#x27;Loss（log scale）&#x27;,
          scale: &#x27;log&#x27;,
          series: [

          tickFormat: v =&gt; v &lt; 0.01 ? v.toFixed(3) : String(v),

        },
        accuracy: {
          yTitle: &#x27;Token accuracy（%）&#x27;,

          series: [
            {key:&#x27;trainAcc&#x27;, label:&#x27;Train accuracy&#x27;, color:&#x27;--viz-series-3&#x27;, format:v =&gt; `${(v * 100).toFixed(2)}%`},

          ticks: [1, 1.5, 2, 2.5, 3, 3.5],

      };
      const visibility = new Map();
      Object.values(configs).flatMap(c =&gt; c.series).forEach(s =&gt; visibility.set(s.key, true));

      const tableBody = root.querySelector(&#x27;[data-checkpoint-table]&#x27;);
      rows.forEach((row, index) =&gt; {
        const previous = index &gt; 0 ? rows[index - 1].evalLoss : null;

        const cells = [

          row.epoch.toFixed(4),

          row.grad === null ? &#x27;—&#x27; : row.grad.toFixed(4),

        cells.forEach(value =&gt; {

          td.textContent = value;

      const cssColor = token =&gt; `var(${token})`;
      const extent = values =&gt; [Math.min(...values), Math.max(...values)];
      const createSvg = (tag, attrs = {}) =&gt; {
        const node = document.createElementNS(NS, tag);

        return node;

      const addText = (parent, text, attrs = {}) =&gt; {
        const node = createSvg(&#x27;text&#x27;, attrs);
        node.textContent = text;
        parent.appendChild(node);
        return node;
      };
      const interpolateAt = (points, xValue) =&gt; {
        if (!points.length) return null;
        if (xValue &lt;= points[0].x) return points[0].y;
        if (xValue &gt;= points[points.length - 1].x) return points[points.length - 1].y;
        let leftIndex = 0;
        while (leftIndex + 1 &lt; points.length &amp;&amp; points[leftIndex + 1].x &lt; xValue) leftIndex += 1;
        const a = points[leftIndex];
        const b = points[leftIndex + 1];
        const t = (xValue - a.x) / (b.x - a.x);
        return a.y + (b.y - a.y) * t;
      };

      function buildLegend(chartKey) {
        const holder = root.querySelector(`[data-legend=&quot;${chartKey}&quot;]`);
        if (!holder) return;
        holder.innerHTML = &#x27;&#x27;;
        configs[chartKey].series.forEach(series =&gt; {
          const button = document.createElement(&#x27;button&#x27;);
          button.type = &#x27;button&#x27;;
          button.setAttribute(&#x27;aria-pressed&#x27;, String(visibility.get(series.key)));
          button.innerHTML = `&lt;span class=&quot;legend-swatch&quot; style=&quot;--series-color:${cssColor(series.color)}&quot;&gt;&lt;/span&gt;&lt;span&gt;${series.label}&lt;/span&gt;`;
          button.addEventListener(&#x27;click&#x27;, () =&gt; {
            const next = !visibility.get(series.key);
            visibility.set(series.key, next);
            button.setAttribute(&#x27;aria-pressed&#x27;, String(next));
            const panel = root.querySelector(`[data-chart=&quot;${chartKey}&quot;]`);
            panel.querySelectorAll(`[data-series=&quot;${series.key}&quot;]`).forEach(node =&gt; node.classList.toggle(&#x27;series-hidden&#x27;, !next));
          });
          holder.appendChild(button);
        });
      }

      function drawChart(chartKey) {
        const config = configs[chartKey];
        const container = root.querySelector(`[data-chart=&quot;${chartKey}&quot;]`);
        container.innerHTML = &#x27;&#x27;;
        const measured = Math.max(320, Math.floor(container.getBoundingClientRect().width));
        const width = measured;
        const height = measured &lt; 430 ? 244 : 270;
        const margin = {top:14, right:24, bottom:48, left:68};
        const innerW = width - margin.left - margin.right;
        const innerH = height - margin.top - margin.bottom;
        const allPoints = config.series.flatMap(series =&gt; rows
          .filter(row =&gt; row[series.key] !== null)
          .map(row =&gt; ({x:row.step, y:row[series.key]})));
        const xExtent = extent(allPoints.map(d =&gt; d.x));
        const xPad = Math.max(45, (xExtent[1] - xExtent[0]) * 0.02);
        const xDomain = [xExtent[0] - xPad, xExtent[1] + xPad];
        const x = value =&gt; margin.left + (value - xDomain[0]) / (xDomain[1] - xDomain[0]) * innerW;
        const yValues = allPoints.map(d =&gt; d.y);
        let yDomain;
        let y;
        if (config.scale === &#x27;log&#x27;) {
          const [lo, hi] = extent(yValues.filter(v =&gt; v &gt; 0));
          yDomain = [lo / 1.3, hi * 1.3];
          const logLo = Math.log(yDomain[0]);
          const logSpan = Math.log(yDomain[1]) - logLo;
          y = value =&gt; margin.top + innerH - (Math.log(value) - logLo) / logSpan * innerH;
        } else {
          const [lo, hi] = extent(yValues);
          const span = Math.max(hi - lo, Math.abs(hi) * 0.08, 0.01);
          yDomain = [Math.max(0, lo - span * 0.1), hi + span * 0.12];
          y = value =&gt; margin.top + innerH - (value - yDomain[0]) / (yDomain[1] - yDomain[0]) * innerH;
        }

        const svg = createSvg(&#x27;svg&#x27;, {
          viewBox:`0 0 ${width} ${height}`,
          role:&#x27;img&#x27;,
          &#x27;aria-labelledby&#x27;:`${chartKey}-svg-title ${chartKey}-svg-desc`
        });
        container.appendChild(svg);
        const title = createSvg(&#x27;title&#x27;, {id:`${chartKey}-svg-title`});
        title.textContent = container.parentElement.querySelector(&#x27;h3&#x27;).textContent;
        svg.appendChild(title);
        const desc = createSvg(&#x27;desc&#x27;, {id:`${chartKey}-svg-desc`});
        desc.textContent = config.desc;
        svg.appendChild(desc);
        svg.appendChild(createSvg(&#x27;rect&#x27;, {
          class:&#x27;chart-frame&#x27;,
          &#x27;data-chart-frame&#x27;:&#x27;&#x27;,
          x:margin.left,
          y:margin.top,
          width:innerW,
          height:innerH,
          fill:&#x27;none&#x27;
        }));

        const narrow = width &lt; 430;
        const xTicks = narrow ? [0, 750, 1500, 2250] : [0, 500, 1000, 1500, 2000];
        config.ticks.filter(tick =&gt; tick &gt;= yDomain[0] &amp;&amp; tick &lt;= yDomain[1]).forEach(tick =&gt; {
          const py = y(tick);
          svg.appendChild(createSvg(&#x27;line&#x27;, {class:&#x27;grid-line&#x27;, x1:margin.left, x2:margin.left + innerW, y1:py, y2:py, stroke:&#x27;var(--border)&#x27;, &#x27;stroke-opacity&#x27;:&#x27;0.55&#x27;}));
          svg.appendChild(createSvg(&#x27;line&#x27;, {class:&#x27;axis-line&#x27;, x1:margin.left - 5, x2:margin.left, y1:py, y2:py, stroke:&#x27;var(--border)&#x27;}));
          addText(svg, config.tickFormat(tick), {class:&#x27;axis-label&#x27;, x:margin.left - 9, y:py + 4, &#x27;text-anchor&#x27;:&#x27;end&#x27;, fill:&#x27;var(--foreground)&#x27;, &#x27;font-size&#x27;:&#x27;12&#x27;});
        });
        xTicks.forEach(tick =&gt; {
          const px = x(tick);
          svg.appendChild(createSvg(&#x27;line&#x27;, {class:&#x27;axis-line&#x27;, x1:px, x2:px, y1:margin.top + innerH, y2:margin.top + innerH + 5, stroke:&#x27;var(--border)&#x27;}));
          addText(svg, String(tick), {class:&#x27;axis-label&#x27;, x:px, y:margin.top + innerH + 19, &#x27;text-anchor&#x27;:&#x27;middle&#x27;, fill:&#x27;var(--foreground)&#x27;, &#x27;font-size&#x27;:&#x27;12&#x27;});
        });
        addText(svg, &#x27;Training step&#x27;, {class:&#x27;axis-title&#x27;, &#x27;data-axis&#x27;:&#x27;x&#x27;, x:margin.left + innerW / 2, y:height - 8, &#x27;text-anchor&#x27;:&#x27;middle&#x27;});
        addText(svg, config.yTitle, {class:&#x27;axis-title&#x27;, &#x27;data-axis&#x27;:&#x27;y&#x27;, transform:`translate(15,${margin.top + innerH / 2}) rotate(-90)`, &#x27;text-anchor&#x27;:&#x27;middle&#x27;});

        const pointsBySeries = new Map();
        config.series.forEach(series =&gt; {
          const points = rows.filter(row =&gt; row[series.key] !== null).map(row =&gt; ({x:row.step, y:row[series.key]}));
          pointsBySeries.set(series.key, points);
          const pathData = points.map((point, index) =&gt; `${index ? &#x27;L&#x27; : &#x27;M&#x27;} ${x(point.x).toFixed(2)} ${y(point.y).toFixed(2)}`).join(&#x27; &#x27;);
          svg.appendChild(createSvg(&#x27;path&#x27;, {
            class:`series-line${visibility.get(series.key) ? &#x27;&#x27; : &#x27; series-hidden&#x27;}`,
            &#x27;data-series&#x27;:series.key,
            stroke:cssColor(series.color),
            d:pathData
          }));
          points.forEach(point =&gt; svg.appendChild(createSvg(&#x27;circle&#x27;, {
            class:`series-dot${visibility.get(series.key) ? &#x27;&#x27; : &#x27; series-hidden&#x27;}`,
            &#x27;data-series&#x27;:series.key,
            cx:x(point.x),
            cy:y(point.y),
            r:3.8,
            fill:cssColor(series.color)
          })));
        });

        const guide = createSvg(&#x27;line&#x27;, {class:&#x27;hover-guide&#x27;, &#x27;data-chart-hover-guide&#x27;:&#x27;&#x27;, y1:margin.top, y2:margin.top + innerH});
        guide.style.display = &#x27;none&#x27;;
        svg.appendChild(guide);
        const markerLayer = createSvg(&#x27;g&#x27;, {&#x27;pointer-events&#x27;:&#x27;none&#x27;});
        svg.appendChild(markerLayer);
        const overlay = createSvg(&#x27;rect&#x27;, {
          &#x27;data-chart-hit&#x27;:&#x27;&#x27;,
          &#x27;data-chart-hover-overlay&#x27;:&#x27;cross-series&#x27;,
          x:margin.left,
          y:margin.top,
          width:innerW,
          height:innerH,
          fill:&#x27;transparent&#x27;,
          &#x27;pointer-events&#x27;:&#x27;all&#x27;
        });
        svg.appendChild(overlay);

        overlay.addEventListener(&#x27;pointermove&#x27;, event =&gt; {
          const bounds = svg.getBoundingClientRect();
          const svgX = (event.clientX - bounds.left) / bounds.width * width;
          const rawX = xDomain[0] + (svgX - margin.left) / innerW * (xDomain[1] - xDomain[0]);
          const xValue = Math.max(xExtent[0], Math.min(xExtent[1], rawX));
          guide.setAttribute(&#x27;x1&#x27;, x(xValue));
          guide.setAttribute(&#x27;x2&#x27;, x(xValue));
          guide.style.display = &#x27;&#x27;;
          markerLayer.replaceChildren();
          const visible = config.series.filter(series =&gt; visibility.get(series.key));
          const tooltipRows = [];
          visible.forEach(series =&gt; {
            const value = interpolateAt(pointsBySeries.get(series.key), xValue);
            if (value === null) return;
            markerLayer.appendChild(createSvg(&#x27;circle&#x27;, {
              class:&#x27;hover-marker&#x27;,
              &#x27;data-chart-hover-marker&#x27;:&#x27;&#x27;,
              cx:x(xValue),
              cy:y(value),
              r:4.5,
              fill:cssColor(series.color)
            }));
            tooltipRows.push(`&lt;div class=&quot;tooltip-row&quot;&gt;&lt;span class=&quot;tooltip-key&quot;&gt;&lt;span class=&quot;tooltip-dot&quot; style=&quot;--series-color:${cssColor(series.color)}&quot;&gt;&lt;/span&gt;${series.label}&lt;/span&gt;&lt;span&gt;${series.format(value)}&lt;/span&gt;&lt;/div&gt;`);
          });
          tooltip.innerHTML = `&lt;strong&gt;Step ${Math.round(xValue)}&lt;/strong&gt;${tooltipRows.join(&#x27;&#x27;)}`;
          tooltip.style.display = &#x27;block&#x27;;
          tooltip.setAttribute(&#x27;aria-hidden&#x27;, &#x27;false&#x27;);
          const rootRect = root.getBoundingClientRect();
          const svgRect = svg.getBoundingClientRect();
          const desiredLeft = svgRect.left - rootRect.left + x(xValue) + 12;
          const maxLeft = Math.max(4, rootRect.width - tooltip.offsetWidth - 4);
          tooltip.style.left = `${Math.max(4, Math.min(desiredLeft, maxLeft))}px`;
          const desiredTop = svgRect.top - rootRect.top + margin.top + Math.min(innerH - 20, 24);
          tooltip.style.top = `${Math.max(4, desiredTop)}px`;
        });
        overlay.addEventListener(&#x27;pointerleave&#x27;, () =&gt; {
          guide.style.display = &#x27;none&#x27;;
          markerLayer.replaceChildren();
          tooltip.style.display = &#x27;none&#x27;;
          tooltip.setAttribute(&#x27;aria-hidden&#x27;, &#x27;true&#x27;);
        });
      }

      Object.keys(configs).forEach(buildLegend);
      const redrawAll = () =&gt; Object.keys(configs).forEach(drawChart);
      redrawAll();
      const observer = new ResizeObserver(entries =&gt; {
        if (!entries.length) return;
        window.clearTimeout(root.__resizeTimer);
        root.__resizeTimer = window.setTimeout(redrawAll, 80);
      });
      root.querySelectorAll(&#x27;.plot&#x27;).forEach(plot =&gt; observer.observe(plot));
    })();
  &lt;/script&gt;
&lt;/div&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
